# Local full stack: Postgres + the app (API and built client together).
#   docker compose up --build
# Then open http://localhost:3001
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: study_buddy
      POSTGRES_USER: study_buddy
      POSTGRES_PASSWORD: study_buddy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study_buddy -d study_buddy"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: study_buddy
      DB_USER: study_buddy
      DB_PASSWORD: study_buddy
      # Local-only secret; generate a real one for any deployment: openssl rand -hex 32
      JWT_SECRET: local-dev-only-secret-change-me-0123456789abcdef
      ALLOWED_ORIGINS: http://localhost:3001
      DEMO_MODE: "true"
      # Optional: enable the AI tutor
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - uploads:/app/uploads
    # Create tables and demo data on every start (both steps are safe to repeat).
    command: sh -c "node scripts/setupDb.js && node scripts/seedDemo.js && node server.js"

volumes:
  pgdata:
  uploads:
