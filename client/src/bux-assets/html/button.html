<!-- Start: @button--default -->
<button class="bux-button">Primary</button>
<!-- End: @button--default -->

<!-- Start: @button--disabled -->
<button class="bux-button bux-button--disabled" aria-disabled="true">
  Disabled
</button>
<!-- End: @button--disabled -->

<!-- Start: @button--alternate -->
<button class="bux-button bux-button--alt">Alternate</button>
<!-- End: @button--alternate -->

<!-- Start: @button--alternate-disabled -->
<button class="bux-button bux-button--alt-disabled" aria-disabled="true">
  Alternate Disabled
</button>
<!-- End: @button--alternate-disabled -->

<!-- Start: @button--small -->
<button class="bux-button bux-button--small">Small</button>
<!-- End: @button--small -->

<!-- Start: @button--small-disabled -->
<button class="bux-button bux-button--small-disabled" aria-disabled="true">
  Small Disabled
</button>
<!-- End: @button--small-disabled -->

<!-- Start: @button--alternate-small -->
<button class="bux-button bux-button--alt-small">Alternate Small</button>
<!-- End: @button--alternate-small -->

<!-- Start: @button--alternate-small-disabled -->
<button class="bux-button bux-button--alt-small-disabled" aria-disabled="true">
  Alternate Small Disabled
</button>
<!-- End: @button--alternate-small-disabled -->

<!-- Start: @button--with-icon -->
<button class="bux-button bux-button--icon">
  <div class="bux-button__icon">
    <span class="icon icon-envelope" aria-hidden="true"></span>
  </div>
  Button with Icon
</button>
<!-- End: @button--with-icon -->
