<section
  class="bux-hero bux-hero--gray bux-hero--card-left bux-hero--carousel bux-hero--3x2"
  aria-roledescription="carousel"
  aria-label="Highlighted stories"
>
  <button
    class="bux-hero__button bux-hero__button--left"
    type="button"
    aria-controls="bux-hero__carousel-1130855492-items"

      type="button"
      role="tab"
      aria-label="Slide 1"
      aria-controls="bux-hero__carousel-1130855492-tab-1"
      tabindex="-1"
    >
